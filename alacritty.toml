[font]
size = 15

[font.normal]
family = "Iosevka"
style = "Regular"

[window]
padding = {x = 10}
dynamic_padding = true

[mouse]
hide_when_typing = true

[colors.primary]
background = "#f5f5f5"
foreground = "#14161b"

[colors.cursor]
cursor = "#14161b" 
text   = "#f0edec"

[colors.normal]
black   = "#1a1a1a"
red     = "#b03030"
green   = "#2e6b3e"
yellow  = "#a05010"
blue    = "#2c4f7a"
magenta = "#7a3868"
cyan    = "#2a6b70"
white   = "#999980"

[colors.bright]
black   = "#555545"
red     = "#cc3535"
green   = "#3a7a4a"
yellow  = "#b85a15"
blue    = "#3a6090"
magenta = "#8f4a82"
cyan    = "#337a80"
white   = "#f7f3e8"
